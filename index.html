<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Portifólio Gabriel</title>

        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="Css/Components/action.css">
        <link rel="stylesheet" href="Css/Components/box.css">
        <link rel="stylesheet" href="Css/Components/button.css">
        <link rel="stylesheet" href="Css/Components/subtitle.css">
        <link rel="stylesheet" href="Css/Components/title.css">
        <link rel="stylesheet" href="Css/Components/banner.css">
        <link rel="stylesheet" href="Css/Components/container.css">
        <link rel="stylesheet" href="Css/Components/bar.css">
        <link rel="stylesheet" href="Css/Components/skill.css">
        <link rel="stylesheet" href="Css/Components/icon.css">
        <link rel="stylesheet" href="Css/Components/skill-position.css">


    </head>
    <body>
        <header>
            <img id="logo" src="Assets/cc.png" alt="Logo">
            
            <nav>
                <a class="action" lang="en" href="">Skills</a>
                <a class="action" href="">Projetos</a>
                <a class="action" href="">Sobre</a>
                <a class="action" href="">Contatos</a>
                <a class="button" lang="en" href="">Download CV</a>
            </nav>
        </header>
        <section class="banner">
            <div class="wrapper">
                <div class="box">
                    <h1 class="title">Gabriel Gomes</h1>
                    
                    <h2 class="subtitle">FrontEnd Student</h2>
                </div>
                <div class="navigation">

                    <a class= "button" lang="en" href="">Download CV</a>
                    <a class="button" href="">Contatos</a>
                </div>
            </div>
        </section>
        <section class="container">
            <h1 id="titulo">Skills</h1>
            <div class="skill-position">
                <article class="skill -space">
                    <img class="icon" src="Assets/HTML5_Badge_512.png" alt="html image">

                    <div class="skill-components">
                    <h2 class="subtitle">HTML</h2>
                    <progress class="bar" max="100" value="70"></progress>
                </div>
                
                </article>
                <article class="skill">
                    <img class="icon" src="Assets/CSS3_logo.svg" alt="css image">
                    
                    <div class="skill-components">
                        <h2 class="subtitle">CSS</h2>
                        <progress class="bar" max="100" value="70"></progress>
                    </div>
                    
                </article>
                <article class="skill -space">
                    <img class="icon" src="Assets/Unofficial_JavaScript_logo_2.svg.png" alt="java script image">
                    
                    <div class="skill-components">
                        <h2 class="subtitle">JAVA SCRIPT</h2>
                        <progress class="bar" max="100" value="70"></progress>
                    </div>
                    
                </article>
                <article class="skill">
                    <img class="icon" src="Assets/java_logo_icon_169577.png" alt="java image">
                    
                    <div class="skill-components">
                        <h2 class="subtitle">JAVA</h2>
                        <progress class="bar" max="100" value="70"></progress>
                    </div>
                    
                </article>
                <article class="skill -space">
                    <img class="icon" src="Assets/Ruby_logo.svg.png" alt="ruby image">
                    
                    <div class="skill-components">
                        <h2 class="subtitle">RUBY</h2>
                        <progress class="bar" max="100" value="70"></progress>
                    </div>
                    
                </article>
                <article class="skill">
                    <img class="icon" src="Assets/Python-logo-notext.svg.png" alt="python image">
                    
                    <div class="skill-components">
                        <h2 class="subtitle">PYTHON</h2>
                        <progress class="bar" max="100" value="70"></progress>
                    </div>
                    
                </article>
                <article class="skill -space ">
                    <img class="icon" src="Assets/golang.png" alt="go image">
                    
                    <div class="skill-components">
                        <h2 class="subtitle">GO</h2>
                        <progress class="bar" max="100" value="70"></progress>
                    </div>
                    
                </article>
                <article class="skill">
                    <img class="icon" src="Assets/Rust_programming_language_black_logo.svg.png" alt="rust image">
                    
                    <div class="skill-components">
                        <h2 class="subtitle">RUST</h2>
                        <progress class="bar" max="100" value="70"></progress>
                    </div>
                    
                </article>
            </div>
        </section>  
    </body>
</html>
