<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <title>Portifólio Gabriel</title>

        <link rel="stylesheet" href="index.css">
        <link rel="stylesheet" href="Css/Components/action.css">
        <link rel="stylesheet" href="Css/Components/box.css">
        <link rel="stylesheet" href="Css/Components/button.css">
        <link rel="stylesheet" href="Css/Components/subtitle.css">
        <link rel="stylesheet" href="Css/Components/title.css">
        <link rel="stylesheet" href="Css/Components/banner.css">
        <link rel="stylesheet" href="Css/Components/container.css">
        <link rel="stylesheet" href="Css/Components/skills.css">
        <link rel="stylesheet" href="Css/Components/imageskill.css">
        <link rel="stylesheet" href="Css/Components/bar.css">
        <link rel="stylesheet" href="Css/Components/skils.css">
        <link rel="stylesheet" href="Css/Components/skilss.css">

    </head>
    <body>
        <header>
            <img src="Assets/cc.png" alt="Logo">
            
            <nav>
                <a class="action" lang="en" href="">Skills</a>
                <a class="action" href="">Projetos</a>
                <a class="action" href="">Sobre</a>
                <a class="action" href="">Contatos</a>
                <a class="button" lang="en" href="">Download CV</a>
            </nav>
        </header>
        <section class="banner">
            <div class="wrapper">
                <div class="box">
                    <h1 class="title">Gabriel Gomes</h1>
                    
                    <h2 class="subtitle">FrontEnd Student</h2>
                </div>
                <div class="navigation">

                    <a class= "button" lang="en" href="">Download CV</a>
                    <a class="button" href="">Contatos</a>
                </div>
            </div>
        </section>
        <section class="container">
            <h1>Skills</h1>
            <div class="skills">
                <div id="skill1">
                    <div class="skilss">
                        <img class="imageskill" src="Assets/HTML5_Badge_512.png" alt="HTML image">
                        <div class="skils">
                            <h2 class="subtitle">HTML</h2>
                            <div class="bar"></div>
                        </div>    
                    </div>
                    
                    <div class="skilss">
                        <img class="imageskill" src="Assets/CSS_logo.svg" alt="CSS image">    
                        <div class="skils">
                            <h2 class="subtitle">CSS</h2>
                            <div class="bar"></div>
                        </div> 
                    </div>
                    
                    <div class="skilss">
                        <img class="imageskill" src="Assets/Unofficial_JavaScript_logo_2.svg.png" alt="JAVAS image">
                        <div class="skils">
                            <h2 class="subtitle">JAVA SCRIPT</h2>
                            <div class="bar"></div> 
                        </div>   
                    </div>
                    
                    <div class="skilss">
                        <img class="imageskill" src="Assets/java_logo_icon_169577.png" alt="JAVA image">
                        <div class="skils">
                            <h2 class="subtitle">JAVA</h2>
                            <div class="bar"></div>
                        </div>
                    </div>
                </div>
                    
                <div id="skill2">
                    <div class="skilss">
                        <img class="imageskill" src="Assets/Ruby_logo.svg.png" alt="RUBY image">
                        <div class="skils">
                            <h2 class="subtitle">RUBY</h2>
                            <div class="bar"></div>
                        </div>
                    </div>

                    <div class="skilss">
                        <img class="imageskill" src="Assets/Python-logo-notext.svg.png" alt="Python image">
                        <div class="skils">
                            <h2 class="subtitle">PYTHON</h2>
                            <div class="bar"></div>
                        </div>
                    </div>

                    <div class="skilss">
                        <img class="imageskill" src="Assets/golang.png" alt="GO image">
                        <div class="skils">
                            <h2 class="subtitle">GO</h2>
                            <div class="bar"></div>
                        </div>
                    </div>

                    <div class="skilss">
                        <img class="imageskill" src="Assets/Rust_programming_language_black_logo.svg.png" alt="RUST image">
                        <div class="skils">
                            <h2 class="subtitle">RUST</h2>
                            <div class="bar"></div>
                        </div>
                    </div>  
                </div>

            </div>
        </section>
    </body>
</html>
